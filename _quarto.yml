project:
  type: website
  output-dir: _site

website:
  title: "Jacob Gray"
  description: "Trade compliance and logistics analytics"
  # Replace with your real domain once DNS is set up, or use
  # https://Hal-Wisp.github.io/portfolio/
  site-url: "https://example.com"
  navbar:
    title: "Jacob Gray"
    left:
      - href: index.qmd
        text: Work
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: "https://github.com/Hal-Wisp"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/jake-gray-0a12023a0/"
        aria-label: LinkedIn
  page-footer:
    left: "Built with Quarto. Source on [GitHub](https://github.com/Hal-Wisp)."
    right: "All analysis uses public or synthetic data."

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-fold: true
    code-summary: "Show code"
    code-tools: true
    code-line-numbers: false
    df-print: kable
    fig-align: left
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

# Renders once, then reuses results unless the source changes.
# Commit the _freeze/ folder so GitHub Actions never re-runs your analysis.
execute:
  freeze: auto
  warning: false
